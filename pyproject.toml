[project]
name = "dotfiles"
version = "0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
python-downloads = "never"
python-preference = "only-system"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["src"]
pythonpath = ["src/modules/claude/templates/hooks"]
addopts = ["-ra", "-q", "-p", "no:cacheprovider"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
